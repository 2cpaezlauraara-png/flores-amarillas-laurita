<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz día de las Flores Amarillas mi Laurita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --gold: #ffd83a;
    --glow: #ffb800;
    --cream: #fff6cf;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --gold: #ffd83a; --glow: #ffb800; --cream: #fff6cf; }
  }
  :root[data-theme="dark"] { --bg: #000; --gold: #ffd83a; --glow: #ffb800; --cream: #fff6cf; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { font-family: "Gochi Hand", "Comic Sans MS", "Segoe Print", cursive; color: var(--cream); }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; }

  .title {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 2.2vh) 4vw 0;
    text-align: center; pointer-events: none;
    font-size: clamp(30px, 6.4vw, 78px); line-height: 1.12; letter-spacing: .02em;
    color: #fff8d6;
    text-shadow:
      0 0 6px #fff2a0, 0 0 14px #ffd83a, 0 0 28px #ffb800, 0 0 52px rgba(255,170,0,.75);
    animation: pulso 4.5s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes pulso {
    0%, 100% { text-shadow: 0 0 6px #fff2a0, 0 0 14px #ffd83a, 0 0 28px #ffb800, 0 0 52px rgba(255,170,0,.7); }
    50%      { text-shadow: 0 0 8px #fff8c8, 0 0 20px #ffe066, 0 0 40px #ffb800, 0 0 76px rgba(255,170,0,.9); }
  }
  .dedicatoria {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 7vh 5vw calc(env(safe-area-inset-bottom, 0px) + 2.2vh);
    text-align: center; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,0) 100%);
    opacity: 0;
  }
  body.go .dedicatoria { animation: aparece 2.6s ease 5.4s forwards; }
  @keyframes aparece { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .dedicatoria .para {
    display: block; font-size: clamp(22px, 3.6vw, 38px); color: var(--gold);
    text-shadow: 0 0 10px rgba(255,184,0,.8);
  }
  .dedicatoria .nombre {
    display: block; font-size: clamp(56px, 11vw, 118px); line-height: 1.02; letter-spacing: .03em;
    color: #fff8d6;
    text-shadow: 0 0 8px #fff2a0, 0 0 20px #ffd83a, 0 0 42px #ffb800, 0 0 72px rgba(255,170,0,.7);
  }
  .dedicatoria .nombre i { font-style: normal; font-size: .5em; color: var(--gold); vertical-align: .28em; margin: 0 .35em; text-shadow: 0 0 12px #ffb800; }
  .dedicatoria .frase {
    display: block; margin-top: .15em; font-size: clamp(20px, 3.5vw, 38px); color: var(--cream);
    text-shadow: 0 0 10px rgba(255,200,60,.85);
  }
  .slot { display: grid; place-items: center; margin-top: 1em; min-height: 46px; }
  .slot > * { grid-area: 1 / 1; }
  .hint {
    display: block; margin: 0; font-size: 16px; color: rgba(255,246,207,.6);
    transition: opacity 1.4s ease;
  }
  .hint.off { opacity: 0; }

  /* ---- entrada ---- */
  #velo { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; pointer-events: none; }
  @keyframes entra { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  body.go .title { animation: entra 2.4s ease .5s both, pulso 4.5s ease-in-out infinite; }

  /* ---- botón de la carta ---- */
  .btn-carta {
    pointer-events: auto; font-family: inherit; font-size: 21px; color: #4a2e00;
    background: linear-gradient(180deg, #fff6b8 0%, #ffd83a 55%, #ffb800 100%);
    border: 0; border-radius: 999px; padding: 9px 24px 10px; min-height: 44px; cursor: pointer;
    box-shadow: 0 0 0 2px rgba(255,246,190,.85), 0 0 22px rgba(255,184,0,.75);
    visibility: hidden; opacity: 0; transform: translateY(8px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-carta.visible { visibility: visible; opacity: 1; transform: none; animation: latido 2.6s ease-in-out 1.2s infinite; }
  .btn-carta.leida { animation: none; }
  @keyframes latido {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,246,190,.85), 0 0 18px rgba(255,184,0,.65); transform: scale(1); }
    50%      { box-shadow: 0 0 0 2px rgba(255,246,190,.95), 0 0 34px rgba(255,200,40,.95); transform: scale(1.045); }
  }

  /* ---- la carta ---- */
  .carta {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  .carta[hidden] { display: none; }
  .carta-fondo {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, rgba(45,28,0,.72), rgba(0,0,0,.92));
    opacity: 0; transition: opacity .7s ease;
  }
  .carta.abierta .carta-fondo { opacity: 1; }
  .carta.cerrando .carta-fondo { opacity: 0; }
  .cerrar {
    position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px;
    width: 44px; height: 44px; border: 0; border-radius: 50%; cursor: pointer;
    font: 22px/44px sans-serif; color: #5a3600; background: rgba(255,246,190,.96);
    box-shadow: 0 0 16px rgba(255,184,0,.7); -webkit-tap-highlight-color: transparent;
  }
  .papel {
    position: relative; z-index: 2; width: min(620px, 100%); max-height: 100%; box-sizing: border-box;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; outline: none;
    background: radial-gradient(120% 90% at 20% 0%, #fffdf0 0%, #fff3bd 58%, #ffe792 100%);
    color: #4b2e00; border-radius: 22px;
    padding: clamp(40px, 7vw, 48px) clamp(22px, 5.5vw, 44px) clamp(22px, 3.5vw, 28px);
    box-shadow: 0 0 0 2px rgba(255,205,50,.95), 0 0 42px rgba(255,184,0,.55), 0 0 110px rgba(255,170,0,.35), 0 20px 60px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(34px) scale(.93) rotate(-1.4deg);
    touch-action: pan-y;
  }
  .carta.abierta .papel { animation: abre .9s cubic-bezier(.2,.9,.25,1) .2s forwards; }
  .carta.cerrando .papel { animation: cierra .45s ease forwards; }
  @keyframes abre { to { opacity: 1; transform: none; } }
  @keyframes cierra { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(26px) scale(.95); } }
  .papel .deco { text-align: center; font-size: 34px; line-height: 1; margin: -6px 0 6px; }
  .papel h2 {
    margin: 0 0 .4em; text-align: center; font-weight: 400; color: #8a5200;
    font-size: clamp(30px, 6.6vw, 42px); line-height: 1.1; text-shadow: 0 1px 0 rgba(255,255,255,.75);
  }
  #cartaCuerpo, .papel .cierre { font-size: clamp(19px, 4.4vw, 23px); line-height: 1.4; }
  #cartaCuerpo { background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(160,105,0,.17) 0) 0 0 / 100% 1.4em; }
  #cartaCuerpo p { margin: 0 0 1.4em; }
  .papel .linea { opacity: 0; transform: translateY(8px); }
  .carta.abierta .linea { animation: escribe .9s ease forwards; animation-delay: calc(.95s + var(--i) * .8s); }
  @keyframes escribe { to { opacity: 1; transform: none; } }
  .papel .cierre { text-align: right; }
  .papel .cierre .firma { display: block; font-size: 1.35em; color: #8a5200; margin-top: .1em; }
  .cerrar-abajo {
    display: block; margin: 20px auto 0; font-family: inherit; font-size: 21px; color: #4a2e00; cursor: pointer;
    background: linear-gradient(180deg, #fff6b8, #ffd83a); border: 0; border-radius: 999px;
    padding: 9px 24px 10px; min-height: 44px; box-shadow: 0 0 0 2px rgba(190,130,0,.35), 0 0 16px rgba(255,184,0,.5);
    -webkit-tap-highlight-color: transparent;
  }

  @media (max-height: 480px) {
    .title { font-size: clamp(22px, 7vh, 44px); }
    .dedicatoria { padding-top: 4vh; }
    .dedicatoria .para { font-size: 18px; }
    .dedicatoria .nombre { font-size: clamp(34px, 15vh, 70px); }
    .dedicatoria .frase { font-size: clamp(16px, 5vh, 24px); }
    .slot { margin-top: .4em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .title, body.go .title { animation: none; opacity: 1; }
    .dedicatoria, body.go .dedicatoria { animation: none; opacity: 1; }
    .btn-carta, .btn-carta.visible { animation: none; transition: none; }
    .carta.abierta .papel, .carta.cerrando .papel { animation: none; }
    .carta.abierta .papel { opacity: 1; transform: none; }
    .carta.cerrando .papel { opacity: 0; }
    .carta.abierta .linea { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="velo"></div>
<h1 class="title" style="font-weight:400;margin:0">
  <span>Feliz día de las<br>Flores Amarillas 🌻</span>
</h1>
<div class="dedicatoria">
  <span class="para">Para</span>
  <span class="nombre"><i>✿</i><span id="nombre">Laura</span><i>✿</i></span>
  <span class="frase">la niña más linda del universo :)</span>
  <div class="slot">
    <span class="hint" id="hint">Arrastra para girar · rueda o pellizca para acercar</span>
    <button class="btn-carta" id="btnCarta" type="button">💌 Leeme :)</button>
  </div>
</div>

<div class="carta" id="carta" hidden aria-hidden="true">
  <div class="carta-fondo" data-cerrar></div>
  <button class="cerrar" type="button" data-cerrar aria-label="Cerrar carta">✕</button>
  <article class="papel" role="dialog" aria-modal="true" aria-labelledby="cartaTitulo" tabindex="-1">
    <div class="deco" aria-hidden="true">🌻</div>
    <h2 id="cartaTitulo"></h2>
    <div id="cartaCuerpo"></div>
    <div class="cierre linea" id="cartaCierre"><span id="cartaCierreTxt"></span><span class="firma" id="cartaFirma"></span></div>
    <button class="cerrar-abajo linea" id="cartaCerrar2" type="button" data-cerrar>Guardar en mi corazón 💛</button>
  </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================  TU CARTA  =====================
   Cambia aquí el texto. {nombre} se reemplaza por el nombre de la dedicatoria.
   Cada línea de "parrafos" es un párrafo. En "firma" puedes poner tu nombre. */
var CARTA = {
  titulo: 'Para mi Laurita ❤️',
  parrafos: [
    'Hoy es el día de las flores amarillas, quise regalarte un cielo entero lleno de ellas, porque una sola flor no alcanza para decirte todo lo que siento.',
    'Eres de esas personas que llegan sin hacer ruido y, aun así, lo llenan todo de luz. Tu sonrisa, tu ternura… y todo en ti me recuerda que las cosas bonitas existen.',
    'Gracias por estar, por cuidarme y por hacer más lindos hasta los días más comunes. Contigo descubrí que la felicidad puede ser algo tan simple como compartir cualquier instante juntos.',
    'Ojalá nunca te falten alegrías, ni motivos para sonreír. Y ojalá yo pueda seguir siempre cerca para ver esa hermosa sonrisa de la que me enamoré perdidamente.'
  ],
  cierre: 'Con todo mi cariño y amor,',
  firma: 'tu niñito Sebastian :)'
};

// por si algo tarda o falla, los textos aparecen igual
setTimeout(function () { document.body.classList.add('go'); }, 5000);

(async function () {
  try {
    await Promise.race([
      document.fonts.load('60px "Gochi Hand"'),
      new Promise(function (r) { setTimeout(r, 1800); })
    ]);
  } catch (e) {}
  init();
})();

function init() {
  var FONT = '"Gochi Hand","Comic Sans MS","Segoe Print",cursive';
  var isMobile = Math.min(innerWidth, innerHeight) < 700;

  // Opcional: ...#para=Otro nombre cambia el nombre de la dedicatoria
  try {
    var m = (location.hash + location.search).match(/para=([^&]*)/);
    if (m && m[1]) {
      document.getElementById('nombre').textContent = decodeURIComponent(m[1].replace(/\+/g, ' '));
    }
  } catch (e) {}

  var REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function easeOutBack(x) { x = clamp01(x); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function easeOutCubic(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); }
  function easeInOutCubic(x) { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

  /* ---------- Renderer ---------- */
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 1);
  document.getElementById('stage').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);

  /* ---------- Texturas base ---------- */
  function radialTex(size, stops) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  var sharpDot = radialTex(64, [[0, 'rgba(255,255,255,1)'], [0.55, 'rgba(255,255,255,.95)'], [1, 'rgba(255,255,255,0)']]);
  var softDot = radialTex(128, [[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,255,255,.55)'], [1, 'rgba(255,255,255,0)']]);
  var glowTex = radialTex(256, [[0, 'rgba(255,225,80,.95)'], [0.35, 'rgba(255,190,0,.35)'], [1, 'rgba(255,170,0,0)']]);

  /* ---------- Estrellas de fondo ---------- */
  (function () {
    var n = 1400, p = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = 220 + Math.random() * 60;
      var s = Math.sqrt(1 - u * u);
      p[i * 3] = r * s * Math.cos(a); p[i * 3 + 1] = r * u; p[i * 3 + 2] = r * s * Math.sin(a);
    }
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size: 1.6, color: 0xffffff, map: sharpDot, transparent: true, opacity: .75, depthWrite: false, sizeAttenuation: false
    })));
  })();

  var galaxy = new THREE.Group();
  scene.add(galaxy);

  /* ---------- Disco de partículas doradas ---------- */
  (function () {
    var N = isMobile ? 15000 : 30000;
    var pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    var palette = [[1, .84, .22], [1, .93, .55], [1, .68, .1], [1, .98, .82]];
    for (var i = 0; i < N; i++) {
      var r = 3.2 + Math.pow(Math.random(), 0.82) * 20;
      var a = Math.random() * Math.PI * 2;
      var y = (Math.random() - .5) * (0.25 + r * 0.035);
      pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = y; pos[i * 3 + 2] = Math.sin(a) * r;
      var c = palette[(Math.random() * palette.length) | 0];
      var k = 0.55 + Math.random() * 0.45;
      col[i * 3] = c[0] * k; col[i * 3 + 1] = c[1] * k; col[i * 3 + 2] = c[2] * k;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    galaxy.add(new THREE.Points(g, new THREE.PointsMaterial({
      size: 0.11, map: sharpDot, vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    })));
  })();

  // Destellos grandes que titilan
  var sparkA, sparkB;
  (function () {
    function layer(n) {
      var p = new Float32Array(n * 3);
      for (var i = 0; i < n; i++) {
        var r = 4 + Math.random() * 19, a = Math.random() * Math.PI * 2;
        p[i * 3] = Math.cos(a) * r; p[i * 3 + 1] = Math.random() * 1.2; p[i * 3 + 2] = Math.sin(a) * r;
      }
      var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
      var pts = new THREE.Points(g, new THREE.PointsMaterial({
        size: 0.55, map: softDot, color: 0xffe680, transparent: true, opacity: .8,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      galaxy.add(pts); return pts;
    }
    sparkA = layer(isMobile ? 70 : 140); sparkB = layer(isMobile ? 70 : 140);
  })();

  /* ---------- Centro: anillo luminoso y cúpula ---------- */
  var ringOuter, ringInner, glow;
  (function () {
    glow = new THREE.Mesh(new THREE.PlaneGeometry(16, 16),
      new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.rotation.x = -Math.PI / 2; glow.position.y = 0.02; galaxy.add(glow);

    ringOuter = new THREE.Mesh(new THREE.RingGeometry(2.6, 3.9, 96), new THREE.MeshBasicMaterial({ color: 0xffe600, side: THREE.DoubleSide }));
    ringOuter.rotation.x = -Math.PI / 2; ringOuter.position.y = 0.05; galaxy.add(ringOuter);

    ringInner = new THREE.Mesh(new THREE.RingGeometry(2.55, 3.0, 96), new THREE.MeshBasicMaterial({ color: 0xfffbe0, side: THREE.DoubleSide, transparent: true, opacity: .95 }));
    ringInner.rotation.x = -Math.PI / 2; ringInner.position.y = 0.07; galaxy.add(ringInner);

    var dome = new THREE.Mesh(new THREE.SphereGeometry(2.3, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x17120a }));
    dome.scale.y = 0.85; galaxy.add(dome);

    var n = 1400, p = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var u = Math.random(), v = Math.random() * Math.PI * 2, ph = Math.acos(u);
      var R = 2.33;
      p[i * 3] = R * Math.sin(ph) * Math.cos(v);
      p[i * 3 + 1] = R * Math.cos(ph) * 0.85;
      p[i * 3 + 2] = R * Math.sin(ph) * Math.sin(v);
    }
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    galaxy.add(new THREE.Points(g, new THREE.PointsMaterial({
      size: 0.06, map: sharpDot, color: 0xffd23a, transparent: true, opacity: .8,
      blending: THREE.AdditiveBlending, depthWrite: false
    })));
  })();

  function flowerTex(src, flip) {
    var img = new Image();
    var t = new THREE.Texture(img);
    t.premultiplyAlpha = true;
    t.anisotropy = 4;
    if (flip) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; t.offset.x = 1; }
    img.onload = function () { t.needsUpdate = true; };
    img.src = src;
    return t;
  }

  /* ---------- Mensajes ---------- */
  function textTex(str, color) {
    var W = 720, H = 160;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d');
    var size = 86; g.font = size + 'px ' + FONT;
    while (g.measureText(str).width > W - 70 && size > 44) { size -= 2; g.font = size + 'px ' + FONT; }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = color === '#fff6cf' ? 'rgba(255,220,90,.9)' : 'rgba(255,180,0,.9)';
    g.shadowBlur = 14; g.fillStyle = color;
    g.fillText(str, W / 2, H / 2 + 4);
    g.shadowBlur = 0; g.fillText(str, W / 2, H / 2 + 4);
    var t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }

  var elNombre = (document.getElementById('nombre').textContent || 'Laura').trim();
  var mensajes = [
    'Feliz día, ' + elNombre + ' ✿',
    'Eres mi flor favorita',
    'Me enamoro de tu sonrisa',
    'Contigo todo florece',
    'Quiero cuidarte siempre',
    'Eres mi sol de cada día',
    'Te quiero muchísimo',
    'Mi corazón te elige',
    'Gracias por existir',
    'Eres lo más bonito de mi vida',
    'Tu risa es mi canción',
    'Cada día me gustas más',
    'Mi lugar feliz eres tú',
    'Te llevo en el corazón',
    'Eres mi razón de sonreír',
    'Sonrío al pensar en ti',
    'Contigo quiero más días',
    'Mi girasol favorito',
    'Tu ternura me desarma',
    'Eres mi casualidad favorita',
    'Contigo el tiempo vuela',
    'Mereces todas las flores',
    'Eres mi pensamiento bonito',
    'Brillas como mil soles',
    'Contigo es primavera',
    'Un regalo del universo',
    'Qué linda eres',
    'Me haces tan feliz',
    elNombre + ', eres mi luz',
    'Pienso en ti, siempre ✿'
  ];
  var colores = ['#ffd400', '#fff6cf', '#ffc61a', '#fff6cf', '#ffe14d'];

  var flotantes = [];
  var textosMat = [];
  var TOTAL_TEXT = mensajes.length;

  function ringPos(k, total, rMin, rMax, offset) {
    var a = k * 2.399963 + offset;
    var r = rMin + Math.pow(k / total, 0.85) * (rMax - rMin);
    return { a: a, r: r };
  }

  // Textos tumbados sobre el disco, siguiendo la tangente
  for (var i = 0; i < TOTAL_TEXT; i++) {
    var P = ringPos(i, TOTAL_TEXT, 6, 19.5, 0.3);
    var str = mensajes[i % mensajes.length];
    var mat = new THREE.MeshBasicMaterial({
      map: textTex(str, colores[i % colores.length]), transparent: true, depthWrite: false, side: THREE.DoubleSide,
      opacity: REDUCE ? 1 : 0
    });
    textosMat.push({ m: mat, d: 3.0 + i * 0.12 });
    var h = 1.2 + P.r * 0.02;
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(h * 4.5, h), mat);
    var pivot = new THREE.Object3D();
    pivot.rotation.y = -P.a;
    mesh.position.set(P.r, 0.12, 0);
    mesh.rotation.set(-Math.PI / 2, 0, Math.PI / 2);
    pivot.add(mesh); galaxy.add(pivot);
  }

  // Flores de pie (sprites con las imágenes)
  var tipos = [
    { k: 'f1', w: 3.9, asp: 393 / 420 },
    { k: 'f4', w: 3.3, asp: 1 },
    { k: 'f2', w: 3.9, asp: 420 / 403 },
    { k: 'f3', w: 3.2, asp: 335 / 317 },
    { k: 'f5', w: 4.1, asp: 345 / 344 }          // ramo de girasoles
  ];
  // orden de las flores: el ramo aparece 6 veces, repartido por el disco
  var SEQ = [0,4,2,1,3,4,0,2,4,3,1,0,4,2,3,4,1,0,2,4];
  var vistos = {};
  var texCache = {};
  function getTex(k, flip) {
    var key = k + (flip ? 'r' : '');
    return texCache[key] || (texCache[key] = flowerTex(IMG[k], flip));
  }
  var TOTAL_FLOWER = 20;
  for (var j = 0; j < TOTAL_FLOWER; j++) {
    var Q = ringPos(j, TOTAL_FLOWER, 8.6, 20.5, 1.6);
    var tp = tipos[SEQ[j % SEQ.length]];
    var flip = (vistos[tp.k] || 0) % 2 === 1;
    vistos[tp.k] = (vistos[tp.k] || 0) + 1;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: getTex(tp.k, flip), transparent: true, depthWrite: false, premultipliedAlpha: true
    }));
    var w = tp.w * 0.82 * (0.85 + Math.random() * 0.3) * (0.85 + Q.r * 0.012);
    var hh = w / tp.asp;
    sp.scale.set(REDUCE ? w : 0.0001, REDUCE ? hh : 0.0001, 1);
    sp.visible = REDUCE;
    var base = hh * 0.5;
    sp.position.set(Math.cos(Q.a) * Q.r, base, Math.sin(Q.a) * Q.r);
    galaxy.add(sp);
    flotantes.push({ sp: sp, base: base, fase: Math.random() * 6.28, w: w, hh: hh, d: 2.2 + j * 0.2 });

    };
  })();
  function fitVideo() {
    // en pantallas angostas la escena queda lejos: se agranda un poco
    var k = Math.min(1.9, Math.max(1, baseRadius() / 26 * 0.9));
    vgK = k;
  }
  fitVideo();

  /* ---------- Pétalos, luciérnagas y chispas ---------- */
  var dummy = new THREE.Object3D();
  var Y_TOP = 15, R_MAX = 23;

  function petalTex() {
    var c = document.createElement('canvas'); c.width = 64; c.height = 96;
    var g = c.getContext('2d');
    g.translate(32, 48);
    var gr = g.createLinearGradient(0, -44, 0, 44);
    gr.addColorStop(0, '#fff3a8'); gr.addColorStop(.55, '#ffc21a'); gr.addColorStop(1, '#ff9d00');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(0, 44);
    g.bezierCurveTo(30, 24, 28, -26, 0, -44);
    g.bezierCurveTo(-28, -26, -30, 24, 0, 44);
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 38); g.lineTo(0, -30); g.stroke();
    return new THREE.CanvasTexture(c);
  }
  function newPetal(anywhere) {
    var a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * R_MAX;
    return {
      x: Math.cos(a) * r, z: Math.sin(a) * r,
      y: anywhere ? Math.random() * Y_TOP : Y_TOP + Math.random() * 2,
      v: 0.7 + Math.random() * 0.9, amp: 0.5 + Math.random() * 1.3, fq: 0.5 + Math.random() * 0.7, ph: Math.random() * 6.28,
      r0x: Math.random() * 6.28, r0y: Math.random() * 6.28, r0z: Math.random() * 6.28,
      sx: 0.6 + Math.random() * 1.0, sy: 0.4 + Math.random() * 0.8, sz: 0.3 + Math.random() * 0.6,
      s: 0.7 + Math.random() * 0.7
    };
  }
  var petalos = null, PET = isMobile ? 46 : 80, petData = [];
  if (!REDUCE) {
    petalos = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.5, 0.75),
      new THREE.MeshBasicMaterial({ map: petalTex(), transparent: true, side: THREE.DoubleSide, depthWrite: false,
        blending: THREE.AdditiveBlending, opacity: .9 }), PET);
    petalos.frustumCulled = false;
    dummy.scale.set(0.0001, 0.0001, 0.0001); dummy.updateMatrix();
    for (var pi = 0; pi < PET; pi++) { petData.push(newPetal(true)); petalos.setMatrixAt(pi, dummy.matrix); }
    scene.add(petalos);
  }
  function updatePetals(t, dt, gain, pk) {
    if (!petalos) return;
    for (var i = 0; i < PET; i++) {
      var d = petData[i];
      d.y -= d.v * dt;
      if (d.y < -0.3) { petData[i] = d = newPetal(false); }
      var edge = Math.min(1, (Y_TOP + 1 - d.y) / 2.5, (d.y + 0.3) / 2.2);
      if (edge < 0) edge = 0;
      var px = d.x + Math.sin(t * d.fq + d.ph) * d.amp, pz = d.z + Math.cos(t * d.fq * 0.8 + d.ph) * d.amp;
      var cd = Math.sqrt((px - camera.position.x) * (px - camera.position.x) + (d.y - camera.position.y) * (d.y - camera.position.y) + (pz - camera.position.z) * (pz - camera.position.z));
      var near = Math.min(1, Math.max(0, (cd - 5) / 9));
      var sc = d.s * gain * edge * pk * near + 0.0001;
      dummy.position.set(px, d.y, pz);
      dummy.rotation.set(d.r0x + t * d.sx, d.r0y + t * d.sy, d.r0z + t * d.sz);
      dummy.scale.set(sc, sc, sc);
      dummy.updateMatrix();
      petalos.setMatrixAt(i, dummy.matrix);
    }
    petalos.instanceMatrix.needsUpdate = true;
  }

  // luciérnagas: puntos suaves que flotan y titilan
  function makeLuci(n) {
    var pos = new Float32Array(n * 3), data = [];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, r = 3 + Math.sqrt(Math.random()) * 19;
      data.push({ x: Math.cos(a) * r, y: 0.8 + Math.random() * 7, z: Math.sin(a) * r,
        ax: 0.6 + Math.random() * 1.6, ay: 0.4 + Math.random() * 0.9, az: 0.6 + Math.random() * 1.6,
        fx: 0.2 + Math.random() * 0.4, fy: 0.25 + Math.random() * 0.4, fz: 0.2 + Math.random() * 0.4, p: Math.random() * 6.28 });
    }
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var pts = new THREE.Points(g, new THREE.PointsMaterial({
      size: 0.42, map: softDot, color: 0xfff0a0, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    pts.frustumCulled = false; scene.add(pts);
    return { pts: pts, data: data, pos: pos };
  }
  function stepLuci(L, t) {
    for (var i = 0; i < L.data.length; i++) {
      var d = L.data[i];
      L.pos[i * 3]     = d.x + Math.sin(t * d.fx + d.p) * d.ax;
      L.pos[i * 3 + 1] = d.y + Math.sin(t * d.fy + d.p * 1.7) * d.ay;
      L.pos[i * 3 + 2] = d.z + Math.cos(t * d.fz + d.p * 0.6) * d.az;
    }
    L.pts.geometry.attributes.position.needsUpdate = true;
  }
  var luciA = null, luciB = null;
  if (!REDUCE) { luciA = makeLuci(isMobile ? 26 : 44); luciB = makeLuci(isMobile ? 26 : 44); }

  // chispas al tocar
  var MAXS = 520;
  var sPos = new Float32Array(MAXS * 3), sVel = new Float32Array(MAXS * 3), sCol = new Float32Array(MAXS * 3), sBase = new Float32Array(MAXS * 3);
  var sLife = new Float32Array(MAXS), sMax = new Float32Array(MAXS), sNext = 0, sAlive = 0;
  for (var si = 0; si < MAXS; si++) sPos[si * 3 + 1] = -999;
  var sG = new THREE.BufferGeometry();
  sG.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  sG.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
  var sparks = new THREE.Points(sG, new THREE.PointsMaterial({
    size: 0.95, map: sharpDot, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  sparks.frustumCulled = false; scene.add(sparks);
  var SPARK_COLS = [[1, .86, .3], [1, .95, .6], [1, .7, .15], [1, 1, .85]];
  function spawnBurst(pt, n, power) {
    for (var k = 0; k < n; k++) {
      var i = sNext; sNext = (sNext + 1) % MAXS;
      var u = Math.random() * 2 - 1, a = Math.random() * 6.283, r = Math.sqrt(1 - u * u);
      var sp = (2.2 + Math.random() * 5.5) * power;
      sPos[i * 3] = pt.x; sPos[i * 3 + 1] = pt.y; sPos[i * 3 + 2] = pt.z;
      sVel[i * 3] = r * Math.cos(a) * sp; sVel[i * 3 + 1] = u * sp + 1.5 * power; sVel[i * 3 + 2] = r * Math.sin(a) * sp;
      var c = SPARK_COLS[(Math.random() * SPARK_COLS.length) | 0];
      sBase[i * 3] = c[0]; sBase[i * 3 + 1] = c[1]; sBase[i * 3 + 2] = c[2];
      sMax[i] = sLife[i] = 1.0 + Math.random() * 0.9;
    }
    sAlive = 1;
  }
  function stepSparks(dt) {
    if (!sAlive) return;
    var any = false, drag = Math.max(0, 1 - 1.6 * dt);
    for (var i = 0; i < MAXS; i++) {
      if (sLife[i] <= 0) continue;
      sLife[i] -= dt;
      if (sLife[i] <= 0) { sCol[i * 3] = sCol[i * 3 + 1] = sCol[i * 3 + 2] = 0; sPos[i * 3 + 1] = -999; continue; }
      any = true;
      sVel[i * 3] *= drag; sVel[i * 3 + 1] = sVel[i * 3 + 1] * drag - 4.5 * dt; sVel[i * 3 + 2] *= drag;
      sPos[i * 3] += sVel[i * 3] * dt; sPos[i * 3 + 1] += sVel[i * 3 + 1] * dt; sPos[i * 3 + 2] += sVel[i * 3 + 2] * dt;
      var f = sLife[i] / sMax[i]; f = f * f * (3 - 2 * f);
      f *= 1.3; sCol[i * 3] = sBase[i * 3] * f; sCol[i * 3 + 1] = sBase[i * 3 + 1] * f; sCol[i * 3 + 2] = sBase[i * 3 + 2] * f;
    }
    sG.attributes.position.needsUpdate = true; sG.attributes.color.needsUpdate = true;
    sAlive = any ? 1 : 0;
  }

  /* ---------- Cámara y controles ---------- */
  var theta = 0, phi = 1.0, radius = 26;
  var tTheta = 0, tPhi = 1.0, tRadius = 26;
  function baseRadius() {
    var asp = innerWidth / innerHeight;
    return Math.min(60, Math.max(20, asp < 1 ? 26 / Math.pow(asp, 0.9) * 0.95 : 26));
  }
  tRadius = radius = baseRadius();
  var minR = 9, maxR = 70;
  var INTRO_CAM = 7.8, introRot = !REDUCE, introZoom = !REDUCE;   // si la persona gira o hace zoom, deja de mandar la entrada
  if (introRot) {                       // la cámara arranca lejos y girada, y se acerca sola
    theta = tTheta = -1.15; phi = tPhi = 1.27;
    radius = tRadius = Math.min(maxR, baseRadius() * 1.85);
  }

  function placeCamera() {
    camera.position.set(
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi) - 1.2,
      radius * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(0, -1.2, 0);
  }

  var stage = renderer.domElement;
  var ptrs = {}, lastPinch = 0, tap = null;
  var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var plane = new THREE.Plane(), tmpDir = new THREE.Vector3(), tmpHit = new THREE.Vector3(), centro = new THREE.Vector3(0, 1.0, 0);

  function setNdc(cx, cy) {
    ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
  }
  function overVideo(cx, cy) {
    if (!vg.visible || vg.scale.x < 0.6 * vgK) return false;     // aún no aparece
    setNdc(cx, cy);
    return raycaster.intersectObjects(hitTargets, false).length > 0;
  }
  function tapPoint(cx, cy) {
    setNdc(cx, cy);
    camera.getWorldDirection(tmpDir);
    plane.setFromNormalAndCoplanarPoint(tmpDir, centro);
    return raycaster.ray.intersectPlane(plane, tmpHit);
  }
  function handleTap(cx, cy) {
    if (cartaAbierta) return;
    if (overVideo(cx, cy)) { abrirCarta(); return; }
    var pt = tapPoint(cx, cy);
    if (pt) spawnBurst(pt, isMobile ? 60 : 80, Math.min(2, Math.max(0.9, radius / 26 * 0.85)));
  }
  function hover(e) {
    if (e.pointerType !== 'mouse') return;
    stage.style.cursor = (!cartaAbierta && overVideo(e.clientX, e.clientY)) ? 'pointer' : '';
  }

  stage.addEventListener('pointerdown', function (e) {
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(ptrs).length === 1) tap = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), ok: true };
    else if (tap) tap.ok = false;
    lastPinch = 0; hideHint();
  });
  stage.addEventListener('pointermove', function (e) {
    var p = ptrs[e.pointerId];
    if (!p) { hover(e); return; }
    if (tap && tap.id === e.pointerId && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 10) tap.ok = false;
    var ids = Object.keys(ptrs);
    if (ids.length === 1) {
      if (!(tap && tap.ok)) introRot = false;
      tTheta -= (e.clientX - p.x) * 0.006;
      tPhi = Math.min(1.32, Math.max(0.35, tPhi - (e.clientY - p.y) * 0.005));
    } else if (ids.length === 2) {
      introRot = false; introZoom = false;
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastPinch) tRadius = Math.min(maxR, Math.max(minR, tRadius * (lastPinch / d)));
      lastPinch = d; return;
    }
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  });
  function endPtr(e, cancelled) {
    var t0 = tap;
    delete ptrs[e.pointerId]; lastPinch = 0;
    if (t0 && t0.id === e.pointerId) {
      tap = null;
      if (!cancelled && t0.ok && performance.now() - t0.t < 600 && Object.keys(ptrs).length === 0) handleTap(e.clientX, e.clientY);
    }
  }
  stage.addEventListener('pointerup', function (e) { endPtr(e, false); });
  stage.addEventListener('pointercancel', function (e) { endPtr(e, true); });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); hideHint(); introZoom = false;
    tRadius = Math.min(maxR, Math.max(minR, tRadius * (1 + e.deltaY * 0.001)));
  }, { passive: false });

  /* ---------- Avisos y botón de la carta ---------- */
  var hintEl = document.getElementById('hint');
  var btnCarta = document.getElementById('btnCarta');
  var btnShown = false;
  function hideHint() { hintEl.classList.add('off'); }
  function showBtn() {
    if (btnShown) return;
    btnShown = true; hideHint(); btnCarta.classList.add('visible');
  }

  /* ---------- La carta ---------- */
  var carta = document.getElementById('carta'), papel = carta.querySelector('.papel');
  var cartaAbierta = false, abiertaEn = 0, cierraTimer = 0;
  (function armarCarta() {
    var nom = document.getElementById('nombre').textContent.trim();
    document.getElementById('cartaTitulo').textContent = (CARTA.titulo || '').replace('{nombre}', nom);
    var cuerpo = document.getElementById('cartaCuerpo');
    CARTA.parrafos.forEach(function (txt, i) {
      var pp = document.createElement('p'); pp.className = 'linea'; pp.style.setProperty('--i', i);
      pp.textContent = txt.replace('{nombre}', nom); cuerpo.appendChild(pp);
    });
    var n = CARTA.parrafos.length;
    document.getElementById('cartaCierre').style.setProperty('--i', n);
    document.getElementById('cartaCierreTxt').textContent = CARTA.cierre || '';
    document.getElementById('cartaFirma').textContent = CARTA.firma || '✿';
    document.getElementById('cartaCerrar2').style.setProperty('--i', n + 1);
  })();
  function abrirCarta() {
    if (cartaAbierta) return;
    cartaAbierta = true; abiertaEn = performance.now();
    clearTimeout(cierraTimer);
    carta.hidden = false; carta.classList.remove('cerrando', 'abierta');
    void carta.offsetWidth;
    carta.classList.add('abierta');
    carta.setAttribute('aria-hidden', 'false');
    papel.scrollTop = 0;
    setTimeout(function () { try { papel.focus({ preventScroll: true }); } catch (err) {} }, 80);
    spawnBurst(new THREE.Vector3(vg.position.x, vg.position.y + VH * vgK / 2, vg.position.z), isMobile ? 70 : 100, 1.5);
    showBtn(); btnCarta.classList.add('leida');
    stage.style.cursor = '';
  }
  function cerrarCarta() {
    if (!cartaAbierta) return;
    cartaAbierta = false;
    carta.classList.add('cerrando');
    carta.setAttribute('aria-hidden', 'true');
    cierraTimer = setTimeout(function () { carta.hidden = true; carta.classList.remove('abierta', 'cerrando'); }, 520);
    try { btnCarta.focus({ preventScroll: true }); } catch (err) {}
  }
  btnCarta.addEventListener('click', abrirCarta);
  carta.addEventListener('click', function (e) {
    if (performance.now() - abiertaEn < 450) return;
    if (e.target.closest('[data-cerrar]')) cerrarCarta();
  });
  addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarCarta(); });

  addEventListener('resize', function () {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    if (!introZoom) tRadius = baseRadius();
    fitVideo();
  });

  /* ---------- Animación ---------- */
  var reduce = REDUCE;
  var clock = new THREE.Clock();
  var veil = document.getElementById('velo');
  var frames = 0, introStart = -1, lastT = 0;
  function loop() {
    requestAnimationFrame(loop);
    var t = clock.getElapsedTime();
    var dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t;
    frames++;
    if (introStart < 0 && frames >= 3) { introStart = t; document.body.classList.add('go'); }
    var tt = reduce ? 99 : (introStart < 0 ? 0 : t - introStart);      // segundos de la entrada
    var e = clamp01(tt / INTRO_CAM);

    // del negro a la galaxia
    if (veil) {
      var vo = reduce ? 0 : 1 - easeOutCubic(tt / 3.2);
      if (vo <= 0.002 && (reduce || tt > 3.2)) { veil.parentNode.removeChild(veil); veil = null; }
      else veil.style.opacity = vo;
    }

    if (!reduce) galaxy.rotation.y += 0.0011 + 0.011 * (1 - e) * (1 - e);

    // la cámara se acerca despacio hasta el video
    if (introRot || introZoom) {
      var ee = easeInOutCubic(e);
      if (introRot) { tTheta = -1.15 * (1 - ee); tPhi = 1.27 + (1.0 - 1.27) * ee; }
      if (introZoom) tRadius = Math.min(maxR, baseRadius() * (1 + 0.85 * (1 - ee)));
      if (e >= 1) { introRot = false; introZoom = false; }
    }
    theta += (tTheta - theta) * 0.08;
    phi += (tPhi - phi) * 0.08;
    radius += (tRadius - radius) * 0.08;
    placeCamera();
    var yaw = Math.atan2(camera.position.x, camera.position.z);
    updateClip(t, reduce);
    vg.rotation.y = yaw;
    vg.position.set(Math.sin(yaw) * 2.7, 1.3, Math.cos(yaw) * 2.7);   // adelante de la cúpula, mirando a la cámara

    // el video aparece primero; el resplandor late suave hasta que abra la carta
    var vs = reduce ? 1 : easeOutBack((tt - 1.0) / 1.4);
    vg.visible = vs > 0.002;
    vg.scale.setScalar(vgK * Math.max(vs, 0.0001));
    if (haloRef) haloRef.material.opacity = 0.8 + (cartaAbierta || btnCarta.classList.contains('leida') ? 0 : 0.14 * Math.sin(t * 2.4));

    var pulse = 1 + Math.sin(t * 1.6) * 0.018;
    ringOuter.scale.set(pulse, pulse, 1);
    glow.material.opacity = 0.85 + Math.sin(t * 1.6) * 0.15;
    sparkA.material.opacity = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.9));
    sparkB.material.opacity = 0.35 + 0.55 * (0.5 + 0.5 * Math.cos(t * 1.9));

    // los mensajes se encienden de adentro hacia afuera
    if (!reduce && tt < 8.6) {
      for (var k = 0; k < textosMat.length; k++) textosMat[k].m.opacity = easeOutCubic((tt - textosMat[k].d) / 0.9);
    }
    // las flores brotan una por una
    for (var q = 0; q < flotantes.length; q++) {
      var f = flotantes[q];
      var sc = reduce ? 1 : easeOutBack((tt - f.d) / 1.1);
      var sb = Math.max(sc, 0.0001);
      f.sp.visible = sc > 0.002;
      f.sp.scale.set(f.w * sb, f.hh * sb, 1);
      f.sp.position.y = f.base * sb + (reduce ? 0 : Math.sin(t * 1.2 + f.fase) * 0.07 * Math.min(1, sb));
    }

    // pétalos y luciérnagas (entran suave cuando termina el video)
    var gainFx = reduce ? 0 : easeInOutCubic((tt - 4.0) / 4.0);
    var pk = Math.min(2, Math.max(0.9, radius / 26 * 0.85));
    updatePetals(t, dt, gainFx, pk);
    if (luciA) {
      stepLuci(luciA, t); stepLuci(luciB, t);
      luciA.pts.material.opacity = gainFx * (0.15 + 0.8 * (0.5 + 0.5 * Math.sin(t * 1.3)));
      luciB.pts.material.opacity = gainFx * (0.15 + 0.8 * (0.5 + 0.5 * Math.cos(t * 1.3)));
    }
    sparks.material.size = 0.95 * pk;
    stepSparks(dt);

    if (tt > 9.6) showBtn();
    renderer.render(scene, camera);
  }
  loop();
}
</script>
</body>
</html>
